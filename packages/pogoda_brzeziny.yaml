# =============================================================================
# Open-Meteo dla Brzezin - pełny zestaw (sensory + encja weather + forecast)
# =============================================================================
# Lokalizacja: Brzeziny, woj. Łódzkie  (51.8019°N, 19.7525°E)
# Model: best_match (Open-Meteo sam wybiera najlepszy - dla PL zwykle ICON-EU 7km)
# API: darmowe, bez klucza, limit 10k zapytań/dobę
# =============================================================================


# -----------------------------------------------------------------------------
# 1) REST SENSOR - AKTUALNE WARUNKI (odświeżane co 10 min)
# -----------------------------------------------------------------------------
rest:
  - resource: https://api.open-meteo.com/v1/forecast
    scan_interval: 600
    params:
      latitude: "51.8019"
      longitude: "19.7525"
      timezone: "Europe/Warsaw"
      current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,snowfall,weather_code,cloud_cover,pressure_msl,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m"
      hourly: "temperature_2m,relative_humidity_2m,dew_point_2m,apparent_temperature,precipitation_probability,precipitation,rain,showers,snowfall,weather_code,pressure_msl,cloud_cover,visibility,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,is_day"
      daily: "weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,daylight_duration,sunshine_duration,uv_index_max,precipitation_sum,rain_sum,showers_sum,snowfall_sum,precipitation_hours,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,shortwave_radiation_sum,et0_fao_evapotranspiration"
      forecast_days: "7"
    sensor:
      - name: "Brzeziny Open-Meteo Current"
        unique_id: brzeziny_openmeteo_current
        value_template: "{{ value_json.current.temperature_2m }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        json_attributes_path: "$.current"
        json_attributes:
          - time
          - temperature_2m
          - relative_humidity_2m
          - apparent_temperature
          - is_day
          - precipitation
          - rain
          - showers
          - snowfall
          - weather_code
          - cloud_cover
          - pressure_msl
          - surface_pressure
          - wind_speed_10m
          - wind_direction_10m
          - wind_gusts_10m

      - name: "Brzeziny Open-Meteo Daily"
        unique_id: brzeziny_openmeteo_daily
        value_template: "{{ value_json.daily.temperature_2m_max[0] }}"
        unit_of_measurement: "°C"
        json_attributes_path: "$.daily"
        json_attributes:
          - time
          - weather_code
          - temperature_2m_max
          - temperature_2m_min
          - apparent_temperature_max
          - apparent_temperature_min
          - sunrise
          - sunset
          - daylight_duration
          - sunshine_duration
          - uv_index_max
          - precipitation_sum
          - rain_sum
          - snowfall_sum
          - precipitation_hours
          - precipitation_probability_max
          - wind_speed_10m_max
          - wind_gusts_10m_max
          - wind_direction_10m_dominant

      - name: "Brzeziny Open-Meteo Hourly"
        unique_id: brzeziny_openmeteo_hourly
        value_template: "{{ value_json.hourly.temperature_2m[0] }}"
        unit_of_measurement: "°C"
        json_attributes_path: "$.hourly"
        json_attributes:
          - time
          - temperature_2m
          - relative_humidity_2m
          - dew_point_2m
          - apparent_temperature
          - precipitation_probability
          - precipitation
          - weather_code
          - pressure_msl
          - cloud_cover
          - visibility
          - wind_speed_10m
          - wind_direction_10m
          - wind_gusts_10m
          - uv_index
          - is_day


# -----------------------------------------------------------------------------
# 2) TEMPLATE SENSORS + ENCJA WEATHER (nowoczesna składnia)
# -----------------------------------------------------------------------------
template:
  - sensor:
      - name: "Brzeziny Temperatura"
        unique_id: brzeziny_temperatura
        state: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'temperature_2m') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer

      - name: "Brzeziny Temperatura Odczuwalna"
        unique_id: brzeziny_temperatura_odczuwalna
        state: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'apparent_temperature') }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-lines

      - name: "Brzeziny Wilgotność"
        unique_id: brzeziny_wilgotnosc
        state: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'relative_humidity_2m') }}"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        icon: mdi:water-percent

      - name: "Brzeziny Ciśnienie"
        unique_id: brzeziny_cisnienie
        state: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'pressure_msl') }}"
        unit_of_measurement: "hPa"
        device_class: atmospheric_pressure
        state_class: measurement
        icon: mdi:gauge

      - name: "Brzeziny Wiatr Prędkość"
        unique_id: brzeziny_wiatr_predkosc
        state: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'wind_speed_10m') }}"
        unit_of_measurement: "km/h"
        device_class: wind_speed
        state_class: measurement
        icon: mdi:weather-windy

      - name: "Brzeziny Wiatr Porywy"
        unique_id: brzeziny_wiatr_porywy
        state: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'wind_gusts_10m') }}"
        unit_of_measurement: "km/h"
        device_class: wind_speed
        state_class: measurement
        icon: mdi:weather-windy-variant

      - name: "Brzeziny Wiatr Kierunek"
        unique_id: brzeziny_wiatr_kierunek
        state: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'wind_direction_10m') }}"
        unit_of_measurement: "°"
        icon: mdi:compass
        attributes:
          kierunek_slownie: >
            {% set d = state_attr('sensor.brzeziny_open_meteo_current', 'wind_direction_10m') | float(0) %}
            {% set dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'] %}
            {{ dirs[(((d + 11.25) / 22.5) | int) % 16] }}

      - name: "Brzeziny Zachmurzenie"
        unique_id: brzeziny_zachmurzenie
        state: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'cloud_cover') }}"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:cloud

      - name: "Brzeziny Opady Aktualne"
        unique_id: brzeziny_opady_aktualne
        state: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'precipitation') }}"
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: measurement
        icon: mdi:weather-rainy

      - name: "Brzeziny Opady Dzisiaj"
        unique_id: brzeziny_opady_dzisiaj
        state: >
          {% set s = state_attr('sensor.brzeziny_open_meteo_daily', 'precipitation_sum') %}
          {{ s[0] if s else 0 }}
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: total
        icon: mdi:weather-pouring

      - name: "Brzeziny Prawdopodobieństwo Opadów Dzisiaj"
        unique_id: brzeziny_prawdopodobienstwo_opadow
        state: >
          {% set s = state_attr('sensor.brzeziny_open_meteo_daily', 'precipitation_probability_max') %}
          {{ s[0] if s else 0 }}
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:weather-rainy

      - name: "Brzeziny UV Index Max"
        unique_id: brzeziny_uv_index_max
        state: >
          {% set s = state_attr('sensor.brzeziny_open_meteo_daily', 'uv_index_max') %}
          {{ s[0] if s else 0 }}
        state_class: measurement
        icon: mdi:weather-sunny-alert

      - name: "Brzeziny Wschód Słońca"
        unique_id: brzeziny_wschod_slonca
        state: >
          {% set s = state_attr('sensor.brzeziny_open_meteo_daily', 'sunrise') %}
          {{ as_timestamp(s[0]) | timestamp_custom('%H:%M') if s else '--:--' }}
        icon: mdi:weather-sunset-up

      - name: "Brzeziny Zachód Słońca"
        unique_id: brzeziny_zachod_slonca
        state: >
          {% set s = state_attr('sensor.brzeziny_open_meteo_daily', 'sunset') %}
          {{ as_timestamp(s[0]) | timestamp_custom('%H:%M') if s else '--:--' }}
        icon: mdi:weather-sunset-down

      - name: "Brzeziny Długość Dnia"
        unique_id: brzeziny_dlugosc_dnia
        state: >
          {% set s = state_attr('sensor.brzeziny_open_meteo_daily', 'daylight_duration') %}
          {% if s %}{{ (s[0] / 3600) | round(1) }}{% else %}0{% endif %}
        unit_of_measurement: "h"
        icon: mdi:weather-sunny

      - name: "Brzeziny Opis Pogody"
        unique_id: brzeziny_opis_pogody
        state: >
          {% set code = state_attr('sensor.brzeziny_open_meteo_current', 'weather_code') | int(0) %}
          {% set opisy = {
            0: 'Słonecznie',
            1: 'Głównie słonecznie',
            2: 'Częściowe zachmurzenie',
            3: 'Pochmurno',
            45: 'Mgła',
            48: 'Mgła osadzająca szron',
            51: 'Mżawka słaba',
            53: 'Mżawka umiarkowana',
            55: 'Mżawka silna',
            56: 'Marznąca mżawka słaba',
            57: 'Marznąca mżawka silna',
            61: 'Deszcz słaby',
            63: 'Deszcz umiarkowany',
            65: 'Deszcz silny',
            66: 'Marznący deszcz słaby',
            67: 'Marznący deszcz silny',
            71: 'Śnieg słaby',
            73: 'Śnieg umiarkowany',
            75: 'Śnieg silny',
            77: 'Ziarna śnieżne',
            80: 'Przelotne opady słabe',
            81: 'Przelotne opady umiarkowane',
            82: 'Przelotne opady gwałtowne',
            85: 'Przelotny śnieg słaby',
            86: 'Przelotny śnieg silny',
            95: 'Burza',
            96: 'Burza z gradem słaba',
            99: 'Burza z gradem silna'
          } %}
          {{ opisy.get(code, 'Nieznane (' ~ code ~ ')') }}
        icon: mdi:weather-partly-cloudy

  - weather:
      - name: "Brzeziny"
        unique_id: brzeziny_weather
        temperature_unit: "°C"
        pressure_unit: hPa
        wind_speed_unit: km/h
        condition: >-
          {% set c = state_attr('sensor.brzeziny_open_meteo_current', 'weather_code') | int(0) %}
          {% set is_day = state_attr('sensor.brzeziny_open_meteo_current', 'is_day') | int(1) %}
          {% if c == 0 %}{{ 'sunny' if is_day else 'clear-night' }}
          {% elif c in [1, 2] %}partlycloudy
          {% elif c == 3 %}cloudy
          {% elif c in [45, 48] %}fog
          {% elif c in [51, 53, 55, 56, 57] %}rainy
          {% elif c in [61, 63, 65, 66, 67, 80, 81, 82] %}rainy
          {% elif c in [71, 73, 75, 77, 85, 86] %}snowy
          {% elif c in [95, 96, 99] %}lightning-rainy
          {% else %}exceptional
          {% endif %}
        temperature: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'temperature_2m') | float(0) }}"
        humidity: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'relative_humidity_2m') | float(0) }}"
        pressure: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'pressure_msl') | float(0) }}"
        wind_speed: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'wind_speed_10m') | float(0) }}"
        wind_bearing: "{{ state_attr('sensor.brzeziny_open_meteo_current', 'wind_direction_10m') | float(0) }}"
        forecast_daily: >-
          {% set d = state_attr('sensor.brzeziny_open_meteo_daily', 'time') %}
          {% set tmax = state_attr('sensor.brzeziny_open_meteo_daily', 'temperature_2m_max') %}
          {% set tmin = state_attr('sensor.brzeziny_open_meteo_daily', 'temperature_2m_min') %}
          {% set codes = state_attr('sensor.brzeziny_open_meteo_daily', 'weather_code') %}
          {% set precip = state_attr('sensor.brzeziny_open_meteo_daily', 'precipitation_sum') %}
          {% set pprob = state_attr('sensor.brzeziny_open_meteo_daily', 'precipitation_probability_max') %}
          {% set wind = state_attr('sensor.brzeziny_open_meteo_daily', 'wind_speed_10m_max') %}
          {% set wdir = state_attr('sensor.brzeziny_open_meteo_daily', 'wind_direction_10m_dominant') %}
          {% set ns = namespace(items=[]) %}
          {% if d %}
            {% for i in range(d | length) %}
              {% set c = codes[i] | int(0) %}
              {% set cond = 'sunny' if c == 0 else
                            'partlycloudy' if c in [1, 2] else
                            'cloudy' if c == 3 else
                            'fog' if c in [45, 48] else
                            'rainy' if c in [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82] else
                            'snowy' if c in [71, 73, 75, 77, 85, 86] else
                            'lightning-rainy' if c in [95, 96, 99] else
                            'exceptional' %}
              {% set ns.items = ns.items + [{
                'datetime': d[i],
                'condition': cond,
                'temperature': tmax[i],
                'templow': tmin[i],
                'precipitation': precip[i],
                'precipitation_probability': pprob[i],
                'wind_speed': wind[i],
                'wind_bearing': wdir[i]
              }] %}
            {% endfor %}
          {% endif %}
          {{ ns.items }}
        forecast_hourly: >-
          {% set t = state_attr('sensor.brzeziny_open_meteo_hourly', 'time') %}
          {% set temp = state_attr('sensor.brzeziny_open_meteo_hourly', 'temperature_2m') %}
          {% set codes = state_attr('sensor.brzeziny_open_meteo_hourly', 'weather_code') %}
          {% set precip = state_attr('sensor.brzeziny_open_meteo_hourly', 'precipitation') %}
          {% set pprob = state_attr('sensor.brzeziny_open_meteo_hourly', 'precipitation_probability') %}
          {% set wind = state_attr('sensor.brzeziny_open_meteo_hourly', 'wind_speed_10m') %}
          {% set wdir = state_attr('sensor.brzeziny_open_meteo_hourly', 'wind_direction_10m') %}
          {% set hum = state_attr('sensor.brzeziny_open_meteo_hourly', 'relative_humidity_2m') %}
          {% set press = state_attr('sensor.brzeziny_open_meteo_hourly', 'pressure_msl') %}
          {% set isday = state_attr('sensor.brzeziny_open_meteo_hourly', 'is_day') %}
          {% set ns = namespace(items=[]) %}
          {% if t %}
            {% set limit = [t | length, 48] | min %}
            {% for i in range(limit) %}
              {% set c = codes[i] | int(0) %}
              {% set day = isday[i] | int(1) %}
              {% set cond = ('sunny' if day else 'clear-night') if c == 0 else
                            'partlycloudy' if c in [1, 2] else
                            'cloudy' if c == 3 else
                            'fog' if c in [45, 48] else
                            'rainy' if c in [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82] else
                            'snowy' if c in [71, 73, 75, 77, 85, 86] else
                            'lightning-rainy' if c in [95, 96, 99] else
                            'exceptional' %}
              {% set ns.items = ns.items + [{
                'datetime': t[i],
                'condition': cond,
                'temperature': temp[i],
                'precipitation': precip[i],
                'precipitation_probability': pprob[i],
                'wind_speed': wind[i],
                'wind_bearing': wdir[i],
                'humidity': hum[i],
                'pressure': press[i]
              }] %}
            {% endfor %}
          {% endif %}
          {{ ns.items }}
